<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexa Home</title>
    <meta name="description" content="Nexa Home — Otomasi Rumah, Asisten Suara, dan Pengawasan Keluarga Lokal" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('theme_mode');
          var isDark = theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = 'rgb(21, 24, 22)';
            document.documentElement.style.color = 'rgb(244, 241, 234)';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = 'rgb(244, 241, 234)';
            document.documentElement.style.color = 'rgb(21, 24, 22)';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="app-shell-skeleton" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; opacity: 0.85;">
          <div style="width: 28px; height: 28px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.75s linear infinite;"></div>
          <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-family: monospace;">Nexa Home</span>
        </div>
      </div>
      <style>
        @keyframes spin { to { transform: rotate(360deg); } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
